name: Reciter photos (Wikimedia Commons)

# Push to reciter-photos: finds a freely licensed portrait of each reciter and
# publishes them (with their credits) to the reciter-photos-results branch for
# review. Never touches the app build.
on:
  push:
    branches: [reciter-photos]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow "opencv-python-headless==4.10.0.84"
          "$RUNNER_TEMP/venv/bin/python" -c "import cv2; print(cv2.__version__, cv2.data.haarcascades)"
          "$RUNNER_TEMP/venv/bin/python" tool/reciters/fetch_photos.py "$RUNNER_TEMP/out" 2>&1 | tee "$RUNNER_TEMP/log.txt"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "rembg[cpu]" 2>&1 | tail -2
          "$RUNNER_TEMP/venv/bin/python" tool/reciters/compose.py "$RUNNER_TEMP/out" assets/icon/logo_mark.png 2>&1 | tee -a "$RUNNER_TEMP/log.txt"
      - name: Ali Jaber studio recording complete?
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"; : > "$RUNNER_TEMP/out/jaber_studio.txt"
          for n in $(seq -w 1 114); do n3=$(printf "%03d" $((10#$n)));
            c=$(curl -s -o /dev/null -w "%{http_code} %{size_download}" -r 0-0 "https://download.quranicaudio.com/quran/abdullaah_alee_jaabir_studio/$n3.mp3")
            echo "$n3 $c" >> "$RUNNER_TEMP/out/jaber_studio.txt"; done
          awk '$2!="206" && $2!="200"' "$RUNNER_TEMP/out/jaber_studio.txt" | head; echo "checked"
      - name: Ali Jaber recordings (mp3quran, quranicaudio)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          curl -s "https://mp3quran.net/api/v3/reciters?language=ar" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          out=[r for r in d['reciters'] if 'جابر' in r['name']]
          json.dump(out, open('$RUNNER_TEMP/out/jaber_mp3quran.json','w'), ensure_ascii=False, indent=1)
          print(json.dumps(out, ensure_ascii=False)[:3000])" || true
          curl -s "https://quranicaudio.com/api/qaris" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          out=[r for r in d if 'jaber' in (r.get('name','')+r.get('relative_path','')).lower() or 'جابر' in (r.get('arabic_name') or '')]
          json.dump(out, open('$RUNNER_TEMP/out/jaber_quranicaudio.json','w'), ensure_ascii=False, indent=1)
          print(json.dumps(out, ensure_ascii=False)[:3000])" || true
      - name: Publish
        if: always()
        run: |
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          cp "$RUNNER_TEMP/log.txt" "$OUT/" || true
          cd "$OUT"
          git init -q -b reciter-photos-results
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git add -A && git commit -qm "reciter photos ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:reciter-photos-results
