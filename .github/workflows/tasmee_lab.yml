name: Tasmee lab
# Phonetic Tasmee: builds the phoneme table and runs its tests.
# Push to tasmee-lab; results go to the tasmee-lab-results branch.
on:
  push:
    branches: [tasmee-lab]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tasmee-lab
  cancel-in-progress: true
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Phoneme table
        run: |
          pip install -q quran-transcript==0.6.4
          mkdir -p "$RUNNER_TEMP/out"
          python3 tool/tasmee/make_phonemes.py . . 2>&1 | tee "$RUNNER_TEMP/out/phonemes_log.txt" | tail -20
          cp assets/tasmee/phonemes.txt assets/tasmee/extra.json "$RUNNER_TEMP/out/"
      - name: Model on real recitations
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "no HF_TOKEN yet" | tee "$RUNNER_TEMP/out/model_log.txt"; exit 0; fi
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q sherpa-onnx numpy
          for v in v3 v3.1; do
            TASMEE_MODEL=$v bash tool/tasmee/fetch_model.sh "$RUNNER_TEMP/model_$v" 2>&1 | tail -4 | tee -a "$RUNNER_TEMP/out/model_log.txt"
            python3 tool/tasmee/eval_model.py "$RUNNER_TEMP/model_$v" "$RUNNER_TEMP/audio" "$RUNNER_TEMP/out/model_events_$v.json" 2>&1 | tee -a "$RUNNER_TEMP/out/model_log.txt" | tail -8
          done
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Tests
        run: |
          flutter pub get > /dev/null
          flutter analyze --no-fatal-infos lib test > "$RUNNER_TEMP/out/analyze.txt" 2>&1 || true
          tail -30 "$RUNNER_TEMP/out/analyze.txt"
          flutter test test/tasmee_phonetic_test.dart -r expanded 2>&1 | tee "$RUNNER_TEMP/out/test.txt" | tail -60
          for v in v3 v3.1; do
            TASMEE_EVENTS="$RUNNER_TEMP/out/model_events_$v.json" flutter test test/tasmee_model_test.dart -r expanded 2>&1 | tee "$RUNNER_TEMP/out/model_test_$v.txt" | tail -30
          done
      - name: Publish results
        if: always()
        run: |
          echo "${GITHUB_SHA}" > "$RUNNER_TEMP/out/SHA.txt"
          cd "$RUNNER_TEMP/out"
          git init -q -b r && git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git add -A && git commit -qm "lab ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:tasmee-lab-results
