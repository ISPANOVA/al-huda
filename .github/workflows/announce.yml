name: Announcement (config site)
# The message shown when the app opens lives on its own small site, so
# changing it never rebuilds or republishes the app.
on:
  push:
    branches: [announce]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: announce
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Always the latest message (a late push event must not publish an
      # older one over a newer save).
      - uses: actions/checkout@v4
        with:
          ref: announce
      - name: Check the message file
        run: python3 -c "import json; json.load(open('site/announce.json', encoding='utf-8')); print('announce.json OK')"
      - name: Deploy to Cloudflare Pages (al-huda-config)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create al-huda-config --production-branch announce || true
          npx --yes wrangler@4 pages deploy site --project-name al-huda-config --branch announce --commit-dirty=true
      - name: Check the message is live
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 10
            if curl -sf "https://al-huda-config.pages.dev/announce.json?t=$(date +%s)" | python3 -c "import json,sys; print(json.load(sys.stdin))"; then break; fi
          done
          curl -sf "https://al-huda-config.pages.dev/announce.json" > /dev/null
          curl -sI "https://al-huda-config.pages.dev/announce.json" | tee headers.txt
          grep -qi "access-control-allow-origin: \*" headers.txt
