name: Android verify (android-verify branch, nothing is published)

# Builds the signed release APK/AAB exactly like build.yml, compares the APK
# with the published build 46, and smoke-tests it on an emulator by
# upgrading build 46 in place. Never creates a release.
on:
  push:
    branches: [android-verify]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      BUILD_NAME: 1.0.0
      # Higher than any real build so it installs over build 46 (never released).
      BUILD_NUMBER: '9999'
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Build signed release APK and AAB (same steps as build.yml)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p shots
          {
            flutter create --platforms=android --org com.alhuda.islamic --project-name al_huda .
            flutter pub get
            dart run flutter_launcher_icons -f flutter_launcher_icons_android.yaml
            dart run tool/configure_platforms.dart
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=alhuda"
              echo "storeFile=$GITHUB_WORKSPACE/keystore/alhuda-upload.p12"
            } > android/key.properties
            flutter build apk --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --dart-define=APP_BUILD=$BUILD_NUMBER --dart-define=APP_VERSION=$BUILD_NAME --dart-define=ANNOUNCE_URL=https://ci.invalid/announce.json
            flutter build appbundle --release --build-name=$BUILD_NAME --build-number=$BUILD_NUMBER --dart-define=APP_BUILD=$BUILD_NUMBER --dart-define=APP_VERSION=$BUILD_NAME --dart-define=ANNOUNCE_URL=https://ci.invalid/announce.json
          } 2>&1 | tee shots/build_log.txt
          rm -f android/key.properties
          cp build/app/outputs/flutter-apk/app-release.apk new.apk
          ls -la new.apk build/app/outputs/bundle/release/app-release.aab | tee shots/sizes.txt
      - name: Compare with published build 46
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download build-46 -p '*.apk' -R "$GITHUB_REPOSITORY" -O old.apk
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2
          for v in old new; do
            $AAPT dump badging $v.apk | grep -vE "^package:|versionCode" | sort > shots/${v}_badging.txt
            $AAPT dump permissions $v.apk | sort > shots/${v}_permissions.txt
            $AAPT dump xmltree --file AndroidManifest.xml $v.apk | grep -vE "versionCode|platformBuildVersion|compileSdkVersion" > shots/${v}_manifest.txt
            unzip -l $v.apk | awk 'NR>3 {print $4}' | grep -v "^$" | sort > shots/${v}_files.txt
            unzip -l $v.apk | grep -E "lib/.*\.so|assets/flutter_assets/assets" | awk '{print $1, $4}' | sort -k2 > shots/${v}_sizes.txt
          done
          ls -la old.apk new.apk | tee -a shots/sizes.txt
          for f in badging permissions manifest files; do
            echo "== $f" >> shots/compare.txt
            diff shots/old_$f.txt shots/new_$f.txt >> shots/compare.txt && echo "identical" >> shots/compare.txt
          done
          echo "== native libs and bundled assets (size path)" >> shots/compare.txt
          diff shots/old_sizes.txt shots/new_sizes.txt >> shots/compare.txt || true
          cat shots/compare.txt
          # The Gradle / Kotlin daemons hold several GB: stop them before the emulator.
          (cd android && ./gradlew --stop) || true
          pkill -f GradleDaemon || true
          pkill -f KotlinCompileDaemon || true
          rm -rf build android/.gradle ~/.gradle/caches
          df -h /
          free -m
      - name: Save comparison now (in case the emulator step dies)
        run: |
          mkdir -p "$RUNNER_TEMP/early" && cp -r shots "$RUNNER_TEMP/early/"
          cd "$RUNNER_TEMP/early"
          git init -q -b verify-compare
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git add -A && git commit -qm "compare ${{ github.run_number }} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:verify-compare
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test (upgrade 46 -> new)
        timeout-minutes: 45
        run: PROBE_SCRIPT=verify_android.sh timeout 40m bash tool/ci/emulator.sh > shots/emu.txt 2>&1 || true
      - name: Push results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/s" && cp -r shots "$RUNNER_TEMP/s/" || true
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git checkout --orphan verify-results-tmp && git rm -rqf --cached . >/dev/null
          rm -rf shots && cp -r "$RUNNER_TEMP/s/shots" . || mkdir shots
          echo "${{ github.sha }}" > shots/SHA.txt
          git add -f shots && git commit -qm "verify ${{ github.run_number }}" && git push -f origin HEAD:verify-results
