name: Probe data sources
# Push to probe: fetches a few public Quran APIs to check what they offer
# (tafsirs, tajweed, word meanings) and publishes the answers to the
# probe-results branch. Never touches the app build.
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          mkdir -p "$RUNNER_TEMP/out"; cd "$RUNNER_TEMP/out"
          UA="AlHudaApp/1.0 (github.com/ISPANOVA/al-huda)"
          for f in Alafasy_128kbps Abdul_Basit_Murattal_192kbps Husary_128kbps Husary_Mujawwad_128kbps Minshawy_Murattal_128kbps \
            Abdurrahmaan_As-Sudais_192kbps Saood_ash-Shuraym_128kbps MaherAlMuaiqly128kbps Ahmed_ibn_Ali_al-Ajamy_128kbps_ketaballah.net \
            Abu_Bakr_Ash-Shaatree_128kbps Hudhaify_128kbps Muhammad_Ayyoub_128kbps Abdullah_Basfar_192kbps Hani_Rifai_192kbps Muhammad_Jibreel_128kbps; do
            echo "$f $(curl -s -o /dev/null -A "$UA" -w '%{http_code}' -r 0-0 https://everyayah.com/data/$f/002255.mp3)" >> everyayah.txt
          done
          curl -sL -A "$UA" --max-time 120 "https://quranpedia.net/dumps/meanings.json.gz" -o meanings.json.gz
          gunzip -c meanings.json.gz > meanings.json
          python3 -c "
          import json; d=json.load(open('meanings.json'))
          print(list(d.keys()))
          print(json.dumps(d['license'].get('sources'), ensure_ascii=False)[:1500])
          for k,v in d.items():
            if k=='license': continue
            print(k, type(v).__name__, len(v) if hasattr(v,'__len__') else v)
            if isinstance(v, dict):
              for kk in list(v)[:3]: print(' ', kk, json.dumps(v[kk], ensure_ascii=False)[:800])
            elif isinstance(v, list):
              for x in v[:3]: print(' ', json.dumps(x, ensure_ascii=False)[:800])
            else: print(' ', json.dumps(v, ensure_ascii=False)[:800])
          " > meanings_head.txt 2>&1
          cat everyayah.txt meanings_head.txt
      - name: Publish
        if: always()
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b probe-results
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git add -A && git commit -qm "probe ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:probe-results
