name: Probe data sources
# Push to probe: fetches a few public Quran APIs to check what they offer
# (tafsirs, tajweed, word meanings) and publishes the answers to the
# probe-results branch. Never touches the app build.
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          mkdir -p "$RUNNER_TEMP/out"; cd "$RUNNER_TEMP/out"
          UA="AlHudaApp/1.0 (github.com/ISPANOVA/al-huda)"
          for f in Husary_128kbps_Mujawwad Husary_Mujawwad_64kbps Husary_64kbps_Mujawwad; do
            echo "$f $(curl -s -o /dev/null -A "$UA" -w '%{http_code}' -r 0-0 https://everyayah.com/data/$f/002255.mp3)" >> everyayah.txt
          done
          curl -sL -A "$UA" --max-time 120 "https://quranpedia.net/dumps/meanings.json.gz" -o meanings.json.gz
          gunzip -c meanings.json.gz > meanings.json
          # Only the classical book (Ibn al-Haim, d. 815 AH): {"surah:ayah": [[words, meaning], ...]}
          python3 -c "
          import json, collections
          d=json.load(open('meanings.json'))
          books=collections.Counter(); out={}
          for e in d['data']:
            for m in e['meanings']:
              books[(m['book_info']['id'], m['book_info']['name'], m['book_info']['author'])]+=1
              if m['book_info']['id']==327:
                out['%d:%d'%(e['surah'],e['ayah'])]=[[w['text'],w['meaning']] for w in m['words'] if w.get('meaning')]
          print(books.most_common())
          json.dump({'source':'التبيان في تفسير غريب القرآن، لابن الهائم (ت ٨١٥هـ)، عبر الموسوعة القرآنية quranpedia.net، نسخة '+d['license'].get('version',''),'ayahs':out}, open('gharib.json','w'), ensure_ascii=False, separators=(',',':'))
          print(len(out), sum(len(v) for v in out.values()))
          " > gharib_report.txt 2>&1
          ls -la gharib.json; cat everyayah.txt gharib_report.txt
          rm -f meanings.json meanings.json.gz
      - name: Publish
        if: always()
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b probe-results
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git add -A && git commit -qm "probe ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:probe-results
