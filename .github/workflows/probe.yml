name: Probe data sources
# Push to probe: fetches a few public Quran APIs to check what they offer
# (tafsirs, tajweed, word meanings) and publishes the answers to the
# probe-results branch. Never touches the app build.
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          mkdir -p "$RUNNER_TEMP/out"; cd "$RUNNER_TEMP/out"
          UA="AlHudaApp/1.0 (github.com/ISPANOVA/al-huda)"
          O="https://al-huda-brf.pages.dev"
          cors() { echo "== $1" >> cors.txt; curl -sI -A "$UA" -H "Origin: $O" --max-time 30 "$1" | grep -iE "^(HTTP|access-control|content-type)" >> cors.txt || echo failed >> cors.txt; }
          cors "https://cdn.islamic.network/quran/audio/128/ar.alafasy/1.mp3"
          cors "https://everyayah.com/data/Alafasy_128kbps/001001.mp3"
          cors "https://api.quran.com/api/v4/tafsirs/91/by_ayah/2:255"
          cors "https://cdn.jsdelivr.net/gh/spa5k/tafsir_api@main/tafsir/ar-tafsir-as-saadi/2/255.json"
          cors "https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/+esm"
          curl -s "https://data.jsdelivr.com/v1/package/npm/mp4-muxer" | head -c 600 > mp4muxer_versions.txt
          curl -sL -A "$UA" --max-time 120 "https://quranpedia.net/dumps/meanings.json.gz" -o meanings.json.gz -w "meanings %{http_code} %{size_download}\n" >> status.txt
          curl -sL -A "$UA" --max-time 120 "https://quranpedia.net/dumps/LICENSE.md" -o LICENSE_quranpedia.md
          (gunzip -c meanings.json.gz > meanings.json && python3 -c "
          import json; d=json.load(open('meanings.json'))
          print(type(d).__name__, len(d))
          s=json.dumps(d, ensure_ascii=False)
          print(s[:3000])" > meanings_head.txt) || echo "no meanings" >> status.txt
          cat cors.txt status.txt meanings_head.txt | head -80
      - name: Publish
        if: always()
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b probe-results
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git add -A && git commit -qm "probe ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:probe-results
