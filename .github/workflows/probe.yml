name: Probe data sources
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Probe
        run: |
          mkdir -p "$RUNNER_TEMP/out"; cd "$RUNNER_TEMP/out"
          UA="AlHudaApp/1.0 (github.com/ISPANOVA/al-huda)"
          for f in topics topics-index; do
            curl -sL -A "$UA" --max-time 120 "https://quranpedia.net/dumps/$f.json.gz" -o $f.json.gz && gunzip -f $f.json.gz
          done
          curl -sL -A "$UA" --max-time 60 "https://quranpedia.net/dumps/manifest.json" -o manifest.json
          ls -la
      - name: Publish
        if: always()
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b probe-results
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git add -A && git commit -qm "probe ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:probe-results
