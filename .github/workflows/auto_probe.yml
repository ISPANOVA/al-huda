name: Android Auto probe (auto-probe branch)
on:
  push:
    branches: [auto-probe]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Build debug APK with the preview screen
        env:
          PREVIEW_WIDGETS: '1'
        run: |
          set -o pipefail
          mkdir -p shots
          {
            flutter create --platforms=android --org com.alhuda.islamic --project-name al_huda .
            flutter pub get
            dart run tool/configure_platforms.dart
            flutter build apk --release --target-platform android-x64
          } 2>&1 | tee shots/build_log.txt
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/app.apk"
          rm -rf build android/.gradle ~/.gradle/caches
          mkdir -p build/app/outputs/flutter-apk && cp "$RUNNER_TEMP/app.apk" build/app/outputs/flutter-apk/app-release.apk
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshots
        timeout-minutes: 27
        run: PROBE_SCRIPT=auto_probe.sh timeout 25m bash tool/ci/emulator.sh > shots/emu.txt 2>&1 || true
      - name: Push results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/s" && cp -r shots "$RUNNER_TEMP/s/" || true
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git checkout --orphan auto-results-tmp && git rm -rqf --cached . >/dev/null
          rm -rf shots && cp -r "$RUNNER_TEMP/s/shots" . || mkdir shots
          echo "${{ github.sha }}" > shots/SHA.txt
          git add -f shots && git commit -qm "widgets ${{ github.run_number }}" && git push -f origin HEAD:auto-results
