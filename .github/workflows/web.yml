name: Web build (iPhone & browsers)

# Separate from the Android build: it never touches the APK/AAB job.
# main        -> branch web-dist          (published site)
# web-preview -> branch web-dist-preview  (testing only)
on:
  push:
    branches: [main, web-preview]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Build
        run: |
          set -o pipefail
          mkdir -p web && cp -r tool/web/. web/
          {
            flutter --version
            flutter pub get
            flutter build web --release --base-href / --no-web-resources-cdn --pwa-strategy=none
          } 2>&1 | tee "$RUNNER_TEMP/web_log.txt" || echo failed > "$RUNNER_TEMP/failed"

      - name: Deploy to Cloudflare Pages (main only)
        if: github.ref_name == 'main' && hashFiles('build/web/index.html') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to publish the site."
            exit 0
          fi
          printf '/index.html\n  Cache-Control: no-cache\n/flutter_bootstrap.js\n  Cache-Control: no-cache\n/main.dart.js\n  Cache-Control: no-cache\n' > build/web/_headers
          npx --yes wrangler@4 pages project create al-huda --production-branch main 2>&1 | tail -3 || true
          npx --yes wrangler@4 pages deploy build/web --project-name al-huda --branch main --commit-dirty=true 2>&1 | tee "$RUNNER_TEMP/deploy.txt"
          grep -o 'https://[a-z0-9.-]*pages.dev' "$RUNNER_TEMP/deploy.txt" | tail -1 > "$RUNNER_TEMP/url.txt" || true

      - name: Publish to branch
        if: always()
        run: |
          TARGET=web-dist
          [ "${GITHUB_REF_NAME}" = "main" ] || TARGET=web-dist-preview
          OUT="$RUNNER_TEMP/site"
          mkdir -p "$OUT"
          if [ -f "$RUNNER_TEMP/failed" ] || [ ! -f build/web/index.html ]; then
            # Keep the last good site; publish only the log for diagnosis.
            TARGET="$TARGET-log"
          else
            cp -r build/web/. "$OUT/"
          fi
          cp "$RUNNER_TEMP/web_log.txt" "$OUT/build_log.txt" 2>/dev/null || true
          cp "$RUNNER_TEMP/deploy.txt" "$OUT/deploy_log.txt" 2>/dev/null || true
          echo "${GITHUB_SHA}" > "$OUT/SHA.txt"
          cd "$OUT"
          git init -q -b "$TARGET"
          git config user.name ci-bot && git config user.email ci-bot@users.noreply.github.com
          git add -A && git commit -qm "web ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$TARGET"
          [ ! -f "$RUNNER_TEMP/failed" ]
